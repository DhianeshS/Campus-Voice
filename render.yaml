# Render Blueprint Infrastructure Specification
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: campusvoice-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://your-campusvoice.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        sync: false
        # Supabase Direct PostgreSQL Connection String:
        # postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres?sslmode=require
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_MAX_CONNECTIONS
        value: 20
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: none
      - key: EMAIL_FROM
        value: CampusVoice <notifications@campusvoice.edu>
      - key: RESEND_API_KEY
        sync: false
